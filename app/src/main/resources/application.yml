spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    # Origens permitidas (separadas por vírgula). Default cobre o dev local (Vite na 5174).
    # Em produção, defina a env var CORS_ALLOWED_ORIGINS com o domínio do Vercel.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    br.com.erp: DEBUG

management.server.port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET}

nextjs:
  revalidate:
    url: ${NEXTJS_REVALIDATE_URL}
    secret: ${NEXTJS_REVALIDATE_SECRET}

whatsapp:
  seller-phone: ${WHATSAPP_SELLER_PHONE}

notification:
  provider: javamail

openai:
  api:
    url: ${OPENAI_API_URL}
    key: ${OPENAI_API_KEY}
    connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:30000}
    max-retries: ${OPENAI_MAX_RETRIES:2}
    retry-backoff-ms: ${OPENAI_RETRY_BACKOFF_MS:500}
  model: ${OPENAI_MODEL}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

service:
  client-id: ${SERVICE_CLIENT_ID}
  client-secret: ${SERVICE_CLIENT_SECRET}
